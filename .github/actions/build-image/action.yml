name: Build image
description: >-
  Builds one image for the runner's architecture and pushes it by digest. The
  digest is uploaded as an artifact for merge-images, which publishes the tag.

inputs:
  stage:
    description: Build stage; merge-images publishes the tags of one stage
    required: true
  image:
    description: Image name under the namespace, e.g. base
    required: true
  tag:
    description: Tag the merged multi-arch image is published as
    required: true
  file:
    description: Dockerfile
    required: true
  build-args:
    description: Build arguments, one per line
    required: false
    default: ''
  token:
    description: Token with packages:write
    required: true

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ inputs.file }}
        build-args: ${{ inputs.build-args }}
        outputs: type=image,name=${{ env.NAMESPACE }}/${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true

    - name: Record digest
      shell: bash
      env:
        REF: ${{ env.NAMESPACE }}/${{ inputs.image }}:${{ inputs.tag }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        mkdir -p "$RUNNER_TEMP/digest"
        echo "$REF $DIGEST" > "$RUNNER_TEMP/digest/${DIGEST#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: digest-${{ inputs.stage }}-${{ inputs.image }}-${{ inputs.tag }}-${{ runner.arch }}
        path: ${{ runner.temp }}/digest/*
        retention-days: 1
