name: Build CI images
on:
  schedule:
    # Saturday 22:00 UTC
    - cron: '0 22 * * 6'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - images/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - images/**
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

env:
  NAMESPACE: ghcr.io/percona-lab/pg_github_actions_images
  TAG_SUFFIX: >-
    ${{ github.event_name == 'pull_request' && format('-PR-{0}', github.event.pull_request.number)
    || github.ref != 'refs/heads/main' && format('-test-{0}', github.run_id)
    || '' }}

# Runs that publish the same tags must not overlap. A new push to a PR
# supersedes the build of its previous head; on main, a run waits for the one in
# progress rather than killing it part-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  base:
    name: Base (${{ matrix.ubuntu }}, ${{ matrix.arch }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
        arch: [amd64, arm64]
        exclude:
          - { ubuntu: '22.04', arch: arm64 }
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build base
        uses: ./.github/actions/build-image
        with:
          stage: base
          image: base
          tag: ${{ matrix.ubuntu }}${{ env.TAG_SUFFIX }}
          file: images/base/Dockerfile
          build-args: UBUNTU_VERSION=${{ matrix.ubuntu }}
          token: ${{ secrets.GITHUB_TOKEN }}

  base-merge:
    name: Publish base
    needs: base
    if: ${{ !cancelled() && needs.base.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish base
        uses: ./.github/actions/merge-images
        with:
          stage: base
          token: ${{ secrets.GITHUB_TOKEN }}

  dev:
    name: Dev (${{ matrix.ubuntu }}, ${{ matrix.arch }})
    needs: base-merge
    if: ${{ !cancelled() && needs.base-merge.result == 'success' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
        arch: [amd64, arm64]
        exclude:
          - { ubuntu: '22.04', arch: arm64 }
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build base-dev
        uses: ./.github/actions/build-image
        with:
          stage: dev
          image: base-dev
          tag: ${{ matrix.ubuntu }}${{ env.TAG_SUFFIX }}
          file: images/base-dev/Dockerfile
          build-args: BASE_IMAGE=${{ env.NAMESPACE }}/base:${{ matrix.ubuntu }}${{ env.TAG_SUFFIX }}
          token: ${{ secrets.GITHUB_TOKEN }}

  dev-merge:
    name: Publish base-dev
    needs: dev
    if: ${{ !cancelled() && needs.dev.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish base-dev
        uses: ./.github/actions/merge-images
        with:
          stage: dev
          token: ${{ secrets.GITHUB_TOKEN }}

  source:
    name: Source (${{ matrix.flavor }}-${{ matrix.major }}-${{ matrix.cc }}-${{ matrix.build_type }}-ubuntu${{ matrix.ubuntu }}, ${{ matrix.arch }})
    needs: dev-merge
    if: ${{ !cancelled() && needs.dev-merge.result == 'success' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [pgdg, psp]
        major: [14, 15, 16, 17, 18, 19]
        cc: [gcc, clang]
        build_type: [debugoptimized, exec-backend]
        ubuntu: ['24.04']
        arch: [amd64, arm64]
        exclude:
          # exec-backend is gcc-only.
          - { build_type: exec-backend, cc: clang }
          # Percona Server is only tested from 16 on.
          - { flavor: psp, major: 14 }
          - { flavor: psp, major: 15 }
          # Only pg_tde's ARM matrix uses source builds on arm64.
          - { arch: arm64, flavor: pgdg }
          - { arch: arm64, build_type: exec-backend }
        include:
          # TODO: pg_stat_monitor and pg_tde sanitizers.yml, which pin ubuntu-22.04.
          - { flavor: psp, major: 18, cc: clang, build_type: sanitize, ubuntu: '22.04', arch: amd64 }
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build postgres-source
        uses: ./.github/actions/build-image
        with:
          stage: final
          image: postgres-source
          tag: ${{ matrix.flavor }}-${{ matrix.major }}-${{ matrix.cc }}-${{ matrix.build_type }}-ubuntu${{ matrix.ubuntu }}${{ env.TAG_SUFFIX }}
          file: images/source/Dockerfile
          build-args: |
            BASE_IMAGE=${{ env.NAMESPACE }}/base-dev:${{ matrix.ubuntu }}${{ env.TAG_SUFFIX }}
            PG_FLAVOR=${{ matrix.flavor }}
            PG_MAJOR=${{ matrix.major }}
            PG_BUILD_TYPE=${{ matrix.build_type }}
            CC=${{ matrix.cc }}
          token: ${{ secrets.GITHUB_TOKEN }}

  pgdg:
    name: PGDG (${{ matrix.major }}-ubuntu${{ matrix.ubuntu }}, ${{ matrix.arch }})
    needs: base-merge
    if: ${{ !cancelled() && needs.base-merge.result == 'success' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        major: [14, 15, 16, 17, 18]
        ubuntu: ['24.04']
        arch: [amd64]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build pgdg
        uses: ./.github/actions/build-image
        with:
          stage: final
          image: pgdg
          tag: ${{ matrix.major }}-ubuntu${{ matrix.ubuntu }}${{ env.TAG_SUFFIX }}
          file: images/pgdg/Dockerfile
          build-args: |
            BASE_IMAGE=${{ env.NAMESPACE }}/base:${{ matrix.ubuntu }}${{ env.TAG_SUFFIX }}
            PG_MAJOR=${{ matrix.major }}
          token: ${{ secrets.GITHUB_TOKEN }}

  psp:
    name: PSP (${{ matrix.major }}-ubuntu${{ matrix.ubuntu }}, ${{ matrix.arch }})
    needs: base-merge
    if: ${{ !cancelled() && needs.base-merge.result == 'success' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        major: [14, 15, 16, 17, 18]
        ubuntu: ['24.04']
        arch: [amd64, arm64]
        exclude:
          # Only pg_stat_monitor's ARM matrix uses packages on arm64.
          - { arch: arm64, major: 14 }
          - { arch: arm64, major: 15 }
          - { arch: arm64, major: 16 }
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build psp
        uses: ./.github/actions/build-image
        with:
          stage: final
          image: psp
          tag: ${{ matrix.major }}-ubuntu${{ matrix.ubuntu }}${{ env.TAG_SUFFIX }}
          file: images/psp/Dockerfile
          build-args: |
            BASE_IMAGE=${{ env.NAMESPACE }}/base:${{ matrix.ubuntu }}${{ env.TAG_SUFFIX }}
            PG_MAJOR=${{ matrix.major }}
          token: ${{ secrets.GITHUB_TOKEN }}

  merge:
    name: Publish postgres-source, pgdg and psp
    needs: [source, pgdg, psp]
    if: ${{ !cancelled() && (needs.source.result != 'skipped' || needs.pgdg.result != 'skipped' || needs.psp.result != 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish postgres-source, pgdg and psp
        uses: ./.github/actions/merge-images
        with:
          stage: final
          token: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Slack notification
    if: (failure() || cancelled()) && github.event_name == 'schedule'
    needs: [base, base-merge, dev, dev-merge, source, pgdg, psp, merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Notify
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "CI image build *${{ contains(needs.*.result, 'failure') && 'failed' || 'was cancelled' }}*. pg_stat_monitor, pg_tde and pg_oidc_validator PRs are now running against stale images.\n
                   <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
