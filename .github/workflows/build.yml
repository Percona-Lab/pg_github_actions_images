name: Build CI images
on:
  schedule:
    # Saturday 22:00 UTC
    - cron: '0 22 * * 6'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - images/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - images/**
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

env:
  NAMESPACE: ghcr.io/percona-lab/pg_github_actions_images
  TAG_SUFFIX: >-
    ${{ github.event_name == 'pull_request' && format('-PR-{0}', github.event.pull_request.number)
    || github.ref != 'refs/heads/main' && format('-test-{0}', github.run_id)
    || '' }}

# Runs that publish the same tags must not overlap. A new push to a PR
# supersedes the build of its previous head; on main, a run waits for the one in
# progress rather than killing it part-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  base:
    name: Base (${{ matrix.ubuntu }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/base/Dockerfile
          build-args: UBUNTU_VERSION=${{ matrix.ubuntu }}
          tags: ${{ env.NAMESPACE }}/base:${{ matrix.ubuntu }}${{ env.TAG_SUFFIX }}
          push: true

  dev:
    name: Dev (${{ matrix.ubuntu }})
    needs: base
    if: ${{ !cancelled() && needs.base.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base-dev
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/base-dev/Dockerfile
          build-args: BASE_IMAGE=${{ env.NAMESPACE }}/base:${{ matrix.ubuntu }}${{ env.TAG_SUFFIX }}
          tags: ${{ env.NAMESPACE }}/base-dev:${{ matrix.ubuntu }}${{ env.TAG_SUFFIX }}
          push: true

  source:
    name: Source (${{ matrix.flavor }}-${{ matrix.major }}-${{ matrix.cc }}-${{ matrix.build_type }}-ubuntu${{ matrix.ubuntu }})
    needs: dev
    if: ${{ !cancelled() && needs.dev.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [pgdg, psp]
        major: [14, 15, 16, 17, 18, 19]
        cc: [gcc, clang]
        build_type: [debugoptimized, exec-backend]
        ubuntu: ['24.04']
        exclude:
          # exec-backend is gcc-only.
          - { build_type: exec-backend, cc: clang }
          # Percona Server is only tested from 16 on.
          - { flavor: psp, major: 14 }
          - { flavor: psp, major: 15 }
        include:
          # TODO: pg_stat_monitor and pg_tde sanitizers.yml, which pin ubuntu-22.04.
          - { flavor: psp, major: 18, cc: clang, build_type: sanitize, ubuntu: '22.04' }
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push postgres-source
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/source/Dockerfile
          build-args: |
            BASE_IMAGE=${{ env.NAMESPACE }}/base-dev:${{ matrix.ubuntu }}${{ env.TAG_SUFFIX }}
            PG_FLAVOR=${{ matrix.flavor }}
            PG_MAJOR=${{ matrix.major }}
            PG_BUILD_TYPE=${{ matrix.build_type }}
            CC=${{ matrix.cc }}
          tags: ${{ env.NAMESPACE }}/postgres-source:${{ matrix.flavor }}-${{ matrix.major }}-${{ matrix.cc }}-${{ matrix.build_type }}-ubuntu${{ matrix.ubuntu }}${{ env.TAG_SUFFIX }}
          push: true

  pgdg:
    name: PGDG (${{ matrix.major }}-ubuntu${{ matrix.ubuntu }})
    needs: base
    if: ${{ !cancelled() && needs.base.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        major: [14, 15, 16, 17, 18]
        ubuntu: ['24.04']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pgdg
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/pgdg/Dockerfile
          build-args: |
            BASE_IMAGE=${{ env.NAMESPACE }}/base:${{ matrix.ubuntu }}${{ env.TAG_SUFFIX }}
            PG_MAJOR=${{ matrix.major }}
          tags: ${{ env.NAMESPACE }}/pgdg:${{ matrix.major }}-ubuntu${{ matrix.ubuntu }}${{ env.TAG_SUFFIX }}
          push: true

  psp:
    name: PSP (${{ matrix.major }}-ubuntu${{ matrix.ubuntu }})
    needs: base
    if: ${{ !cancelled() && needs.base.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        major: [14, 15, 16, 17, 18]
        ubuntu: ['24.04']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push psp
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/psp/Dockerfile
          build-args: |
            BASE_IMAGE=${{ env.NAMESPACE }}/base:${{ matrix.ubuntu }}${{ env.TAG_SUFFIX }}
            PG_MAJOR=${{ matrix.major }}
          tags: ${{ env.NAMESPACE }}/psp:${{ matrix.major }}-ubuntu${{ matrix.ubuntu }}${{ env.TAG_SUFFIX }}
          push: true

  notify:
    name: Slack notification
    if: (failure() || cancelled()) && github.event_name == 'schedule'
    needs: [base, dev, source, pgdg, psp]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Notify
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "CI image build *${{ contains(needs.*.result, 'failure') && 'failed' || 'was cancelled' }}*. pg_stat_monitor, pg_tde and pg_oidc_validator PRs are now running against stale images.\n
                   <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
